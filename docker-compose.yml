services:
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --check=false
      - --node-id
      - "0"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:9092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "9092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--brokers", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20
  redpanda-topic-init:
    image: redpandadata/redpanda:v24.2.18
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for topic in roboops.telemetry.readings.v1 roboops.telemetry.readings.dlq.v1; do
          rpk topic describe "$$topic" --brokers redpanda:9092 >/dev/null 2>&1 ||
          rpk topic create "$$topic" --brokers redpanda:9092 --partitions 1 --replicas 1;
        done
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roboops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roboops_pass}
      POSTGRES_DB: ${POSTGRES_DB:-roboops_db}
    ports:
      - "5433:5432"
    volumes:
      - roboops_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roboops_user} -d ${POSTGRES_DB:-roboops_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://roboops_user:roboops_pass@postgres:5432/roboops_db
      TEST_DATABASE_URL: postgresql+psycopg://roboops_user:roboops_pass@postgres:5432/roboops_test_db
      MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://roboops_user:roboops_pass@postgres:5432/roboops_migration_test_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on: [backend]
volumes:
  roboops_pgdata:
