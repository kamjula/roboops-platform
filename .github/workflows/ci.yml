name: CI
on: [push, pull_request]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: pytest

  backend-db-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roboops_user
          POSTGRES_PASSWORD: roboops_pass
          POSTGRES_DB: roboops_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U roboops_user -d roboops_test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql+psycopg://roboops_user:roboops_pass@localhost:5432/roboops_db
      TEST_DATABASE_URL: postgresql+psycopg://roboops_user:roboops_pass@localhost:5432/roboops_test_db
      MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://roboops_user:roboops_pass@localhost:5432/roboops_migration_test_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create additional databases (safe if they already exist)
        env:
          PGPASSWORD: roboops_pass
        run: |
          psql -h localhost -U roboops_user -d roboops_test_db -v ON_ERROR_STOP=1 -c "SELECT 'CREATE DATABASE roboops_db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'roboops_db')\gexec"
          psql -h localhost -U roboops_user -d roboops_test_db -v ON_ERROR_STOP=1 -c "SELECT 'CREATE DATABASE roboops_migration_test_db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'roboops_migration_test_db')\gexec"
      - run: pip install -r requirements.txt
      - name: Run Alembic migrations against DATABASE_URL
        run: alembic upgrade head
      - run: pytest -v

  frontend-tests:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm install
      - run: npm test
      - run: npm run build
