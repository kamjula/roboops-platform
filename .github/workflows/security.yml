name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r backend/requirements.txt --progress-spinner off
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: "npm", cache-dependency-path: "frontend/package-lock.json"}
      - name: Audit production JavaScript dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  container-scan:
    name: Container scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
            dockerfile: docker/backend.Dockerfile
          - component: frontend
            context: frontend
            dockerfile: docker/frontend.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.component }} image
        run: >-
          docker build
          --file ${{ matrix.dockerfile }}
          --tag roboops-${{ matrix.component }}:security
          ${{ matrix.context }}
      - name: Scan for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: roboops-${{ matrix.component }}:security
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
