version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /docker
    schedule: {interval: weekly}
    groups:
      container-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
